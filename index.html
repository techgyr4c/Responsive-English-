<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learn English App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#4facfe,#00f2fe);
min-height:100dvh;
overflow-x:hidden;
color:white;
}

/* ================= GLOBAL ================= */

.screen{
display:none;
min-height:100dvh;
padding:20px;
}

.active{
display:block;
animation:fade .35s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

button{
border:none;
outline:none;
cursor:pointer;
font-family:'Inter',sans-serif;
transition:.25s;
}

button:hover{
transform:scale(1.03);
}

img{
display:block;
}

.glass{
background:rgba(255,255,255,.14);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.18);
box-shadow:0 8px 30px rgba(0,0,0,.15);
}

/* ================= HOME ================= */

.home{
display:flex;
justify-content:center;
align-items:center;
min-height:100dvh;
}

.home-card{
width:100%;
max-width:550px;
padding:35px;
border-radius:30px;
}

.logo{
font-size:2.2rem;
font-weight:800;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.9;
line-height:1.6;
margin-bottom:35px;
}

.menu-grid{
display:grid;
gap:22px;
}

.menu-btn{
min-height:120px;
border-radius:24px;
font-size:1.25rem;
font-weight:700;
color:white;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
padding:20px;
}

.quiz-btn{
background:linear-gradient(135deg,#ff416c,#B22222);
}

.reading-btn{
background:linear-gradient(135deg,#11998e,#38ef7d);
}

 .gamer-btn{
  background:linear-gradient(135deg,#7FFF00,#ff4b2b); 
  }
  
  .Theory-btn{
  background:linear-gradient(135deg,#00BFFF,#4169E1); 
  }

/* ================= TOPBAR ================= */

.topbar{
display:flex;
align-items:center;
gap:12px;
margin-bottom:22px;
flex-wrap:wrap;
}

.back-btn{
background:black;
color:white;
padding:12px 18px;
border-radius:14px;
font-weight:700;
}

.page-title{
font-size:1.5rem;
font-weight:800;
}

/* ================= QUIZ ================= */

.quiz-categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:16px;
}

.category{
padding:20px;
border-radius:22px;
background:white;
color:#222;
font-weight:700;
font-size:1rem;
cursor:pointer;
text-align:center;
transition:.25s;
}

.category:hover{
transform:translateY(-5px);
}

.quiz-game{
display:none;
justify-content:center;
margin-top:25px;
}

.quiz-card{
width:100%;
max-width:430px;
padding:20px;
border-radius:28px;
background:#1e3c72;
}

.quiz-top{
display:flex;
justify-content:space-between;
font-weight:700;
margin-bottom:14px;
}

.progress-bar{
height:8px;
background:#ccc;
border-radius:20px;
overflow:hidden;
margin-bottom:18px;
}

.progress{
height:100%;
width:0%;
background:#7CFC00;
transition:.3s;
}

.quiz-image{
width:100%;
height:240px;
object-fit:cover;
border-radius:18px;
background:#ddd;
}

.quiz-title{
text-align:center;
margin:18px 0;
font-size:1.5rem;
}

.quiz-options{
display:flex;
flex-direction:column;
gap:12px;
}

.quiz-options button{
padding:15px;
border-radius:14px;
font-size:16px;
font-weight:700;
color:white;
min-height:55px;
}

.option1{
background:#ff4b5c;
}

.option2{
background:#28a745;
}

.option3{
background:blue;
}

.feedback{
margin-top:18px;
text-align:center;
font-weight:700;
min-height:24px;
}

/* ================= BOOKS ================= */

.books{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px;
}

.book{
background:white;
color:#222;
border-radius:24px;
overflow:hidden;
cursor:pointer;
transition:.3s;
box-shadow:0 6px 20px rgba(0,0,0,.1);
}

.book:hover{
transform:translateY(-7px);
}

.book img{
width:100%;
height:260px;
object-fit:cover;
}

.book-title{
padding:16px;
font-weight:700;
text-align:center;
font-size:1.05rem;
}

/* ================= READER ================= */

.reader{
display:none;
justify-content:center;
}

.document{
width:100%;
max-width:900px;
background:#fcf7ec;
border-radius:28px;
padding:28px;
color:#222;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.doc-title{
font-size:2rem;
font-weight:800;
color:#b22234;
margin-bottom:20px;
}

.book-image{
width:100%;
height:340px;
object-fit:cover;
border-radius:20px;
margin-bottom:25px;
}

.order-text p{
font-size:21px;
line-height:1.9;
margin-bottom:14px;
font-family:Georgia,serif;
}

.word{
cursor:pointer;
padding:2px 3px;
border-radius:5px;
transition:.2s;
}

.word:hover{
background:#ffeaa7;
}

.correct{
color:#0a8f08;
font-weight:700;
}

.incorrect{
color:#d11a2a;
font-weight:700;
}

.active-word{
background:#ffeaa7;
}

.phonetic{
font-style:italic;
font-size:15px;
opacity:.8;
margin-bottom:12px;
}

.translation{
display:none;
background:#f5efe6;
padding:14px;
border-radius:14px;
margin-bottom:12px;
border-left:5px solid #b22234;
}

.actions{
display:flex;
gap:10px;
margin-bottom:30px;
flex-wrap:wrap;
}

.actions button{
flex:1;
padding:14px;
border-radius:12px;
font-weight:700;
min-width:110px;
}

.translate-btn{
background:#3c3b6e;
color:white;
}

.speak-btn{
background:#ff4b5c;
color:white;
}

.mic-btn{
background:#1d976c;
color:white;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

.screen{
padding:15px;
}

.logo{
font-size:1.8rem;
}

.menu-btn{
font-size:1rem;
min-height:100px;
}

.page-title{
font-size:1.2rem;
}

.quiz-image{
height:200px;
}

.book img{
height:220px;
}

.document{
padding:18px;
}

.doc-title{
font-size:1.5rem;
}

.book-image{
height:230px;
}

.order-text p{
font-size:17px;
line-height:1.7;
}

.actions{
flex-direction:column;
}

.actions button{
width:100%;
}

}

</style>
</head>

</div>

</div>

</section>

<!-- ================= QUIZ ================= -->

</div>

<div class="category"

</div>

<div class="category"

</div>

<div class="category"

</div>

</div>

<div class="quiz-title">
What is this?
</div>

<img id="quizImage"
class="quiz-image"
loading="lazy">

<div class="quiz-options">

<button class="option1"></button>

<button class="option2"></button>

<button class="option3"></button>

</div>

<div class="feedback"
id="feedback"></div>

</div>

</div>

</section>

<!-- ================= READING ================= -->

<section id="readingScreen"
class="screen">

<div class="topbar">

<button class="back-btn"

⬅ Back

</button>

<div class="page-title">
Practice Reading
</div>

</div>

<!-- BOOKS -->

<div class="books"
id="books"></div>

<!-- READER -->

<div class="reader"
id="reader">

<button class="back-btn"

⬅ Back

</section>

/* ================= QUIZ ================= */

let quizData = [];
let currentQuestion = 0;
let quizScore = 0;

const quizGame =
document.getElementById("quizGame");

const quizImage =
document.getElementById("quizImage");

const optionButtons =
document.querySelectorAll(".quiz-options button");

function startQuiz(category){

quizGame.style.display="flex";

quizData = [...categories[category]];

currentQuestion = 0;

quizScore = 0;

document.getElementById("score")
.innerText="Score: 0";

loadQuestion();

}

function loadQuestion(){

const q = quizData[currentQuestion];

quizImage.src = q.img;

document.getElementById("count")
.innerText=
`${currentQuestion+1}/${quizData.length}`;

document.getElementById("progress")
.style.width=
((currentQuestion)/quizData.length)*100+"%";

optionButtons.forEach((btn,index)=>{

btn.disabled=false;

btn.innerText=q.opt[index];

btn.classList.remove("correct-answer");
btn.classList.remove("wrong-answer");

btn.onclick=()=>{

checkAnswer(btn,q.opt[index]);

};

});

document.getElementById("feedback")
.innerText="";

speakSequence(q.opt);

}

function checkAnswer(button,selected){

const correct =
quizData[currentQuestion].ans;

optionButtons.forEach(btn=>{

btn.disabled=true;

});

if(selected===correct){

button.style.background="green";

document.getElementById("feedback")
.innerText="✅ Correct!";

document.getElementById("correctSound")
.play();

quizScore++;

document.getElementById("score")
.innerText="Score: "+quizScore;

}else{

button.style.background="red";

document.getElementById("feedback")
.innerText=
"❌ Correct answer: "+correct;

document.getElementById("wrongSound")
.play();

}

setTimeout(()=>{

currentQuestion++;

if(currentQuestion<quizData.length){

loadQuestion();

}else{

document.getElementById("progress")
.style.width="100%";

document.getElementById("feedback")
.innerText=
`🎉 Final Score: ${quizScore}/${quizData.length}`;

}

},1500);

}

/* ================= SPEAK ================= */

function speak(text,delay=0){

setTimeout(()=>{

const msg =
new SpeechSynthesisUtterance(text);

msg.lang="en-US";

msg.rate=.95;

speechSynthesis.speak(msg);

},delay);

}

function speakSequence(options){

speechSynthesis.cancel();

speak("What is this?");

options.forEach((word,index)=>{

speak(word,(index+1)*900);

});

}

function speakParagraph(text){

speechSynthesis.cancel();

const msg =
new SpeechSynthesisUtterance(text);

msg.lang="en-US";

msg.rate=.9;

speechSynthesis.speak(msg);

}

/* ================= CREATE BOOKS ================= */

const booksContainer =
document.getElementById("books");

booksData.forEach((book,index)=>{

booksContainer.innerHTML += `

<div class="book"
onclick="openBook(${index})">

<img src="${book.img}"
loading="lazy">

<div class="book-title">
${book.title}
</div>

</div>

`;

});

/* ================= OPEN BOOK ================= */

function openBook(index){

document.getElementById("books")
.style.display="none";

document.getElementById("reader")
.style.display="flex";

const content =
document.getElementById("content");

content.innerHTML="";

document.getElementById("bookTitle")
.innerText=booksData[index].title;

document.getElementById("bookImage")
.src=booksData[index].img;

booksData[index].content.forEach((p,i)=>{

content.innerHTML += `

<p>

${wrapWords(p.en,i)}

</p>

<div class="phonetic">
${p.ph}
</div>

<div class="translation"
id="t${i}">
${p.es}
</div>

<div class="actions">

<button class="translate-btn"
onclick="toggleTranslation(${i})">

Translation

</button>

<button class="speak-btn"
onclick="speakParagraph('${p.en}')">

<i class="fa-solid fa-volume-high"></i>

</button>

<button class="mic-btn"
onclick="startListening(${i})">

<i class="fa-solid fa-microphone"></i>

</button>

</div>

`;

});

}

/* ================= BACK BOOKS ================= */

function goBackBooks(){

document.getElementById("books")
.style.display="grid";

document.getElementById("reader")
.style.display="none";

}

/* ================= TRANSLATION ================= */

function toggleTranslation(index){

const el =
document.getElementById("t"+index);

el.style.display =
el.style.display==="block"
? "none"
: "block";

}

/* ================= CLICKABLE WORDS ================= */

function wrapWords(text,index){

return text.split(" ")
.map(word=>{

const clean =
word.replace(/[^a-zA-Z]/g,'')
.toLowerCase();

return `

<span class="word"
data-index="${index}"
data-word="${clean}"
onclick="speak('${clean}')">

${word}

</span>

`;

}).join(" ");

}

/* ================= VOICE RECOGNITION ================= */

let recognition;
let listening=false;

function startListening(index){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"Speech recognition not supported"
);

return;

}

if(!recognition){

recognition =
new SpeechRecognition();

recognition.lang="en-US";

recognition.interimResults=true;

recognition.continuous=true;

recognition.maxAlternatives=1;

}

if(listening){

recognition.stop();

listening=false;

return;

}

const spans =
document.querySelectorAll(
`span[data-index="${index}"]`
);

recognition.start();

listening=true;

recognition.onresult=function(event){

const transcript =
Array.from(event.results)
.map(r=>r[0].transcript)
.join("")
.toLowerCase()
.replace(/[^\w\s]/g,"");

const spokenWords =
transcript.split(/\s+/);

spans.forEach(span=>{

span.classList.remove(
"active-word",
"correct",
"incorrect"
);

});

spokenWords.forEach((word,i)=>{

if(!spans[i]) return;

const expected =
spans[i].dataset.word;

spans[i]
.classList.add("active-word");

if(

word===expected ||

word.includes(expected) ||

expected.includes(word)

){

spans[i]
.classList.add("correct");

}else{

spans[i]
.classList.add("incorrect");

}

});

};

recognition.onerror=function(event){

console.log(event.error);

listening=false;

};

recognition.onend=function(){

listening=false;

};

}

</script>
